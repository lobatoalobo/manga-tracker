name: Crawl

# Corre los crawls/jobs de SITIO en un runner de GitHub (sin el límite de 60s de
# Vercel). Ejecución MANUAL (Actions / botones del admin); sin cron.
# OJO: lo de WHAKOOM NO va acá — Whakoom bloquea a los runners de GitHub
# (validado: 0 ediciones desde Actions, 298 local). Se corre LOCAL con
# `npm run crawl whakoom-all` (ver /admin/scripts).
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Qué job correr"
        required: true
        type: choice
        options:
          - ivrea
          - mangakas
          - resolve

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run job (${{ inputs.job }})
        shell: bash
        run: |
          case "${{ inputs.job }}" in
            ivrea)    npm run crawl ivrea ;;
            mangakas) npm run crawl mangakas ;;
            resolve)  npm run crawl resolve ;;
            *) echo "Job desconocido: ${{ inputs.job }}"; exit 1 ;;
          esac
